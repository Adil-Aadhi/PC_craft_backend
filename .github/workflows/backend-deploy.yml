name: CI/CD - PC Craft Backend

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            adilaadhi/backend:latest
            adilaadhi/backend:${{ github.sha }}

      - name: Deploy to k3s
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Update backend
            sudo kubectl set image deployment/pc-backend \
              backend=adilaadhi/backend:${{ github.sha }}
            sudo kubectl rollout status deployment/pc-backend --timeout=120s

            # Update celery-worker (same image, different deployment)
            sudo kubectl set image deployment/celery-worker \
              celery-worker=adilaadhi/backend:${{ github.sha }}
            sudo kubectl rollout status deployment/celery-worker --timeout=120s

            echo "✅ Backend + Celery deployed!"
            sudo kubectl get pods -l app=pc-backend
            sudo kubectl get pods -l app=celery-worker
